name: CI (develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: osb.shell

      # The shell consumes osbkt and osb.core by linked sources (sibling
      # checkouts), not by ProjectReference. CI must place them side by side
      # at deterministic refs or the build fails the CheckSiblings target.
      - name: Checkout osbkt (sibling)
        uses: actions/checkout@v4
        with:
          repository: osb-foundation/osbkt
          ref: develop
          path: osbkt

      - name: Checkout osb.core (sibling)
        uses: actions/checkout@v4
        with:
          repository: osb-foundation/osb.core
          ref: develop
          path: osb.core

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install Cake tool
        run: dotnet tool install --global Cake.Tool

      - name: Validate version metadata (SemVer)
        run: dotnet cake scripts/validate-version.cake --versionJson=version.json --expectGeneration=0 --expectCodename=Olorun
        working-directory: osb.shell

      - name: Build OSB shell
        run: dotnet build -c Release Osb.Shell.Userspace.csproj -v q -nologo
        working-directory: osb.shell

      - name: Run host unit tests
        run: dotnet test -c Release tests/unit/Osb.Shell.Unit.csproj -v q -nologo
        working-directory: osb.shell